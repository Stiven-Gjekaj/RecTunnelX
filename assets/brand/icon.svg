<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The icon of RecTunnelX: a tunnel of screens that goes into the
       distance, with the red dot of a recording at its end. -->
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4a"/>
      <stop offset="1" stop-color="#121418"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ff6b5e"/>
      <stop offset="0.6" stop-color="#e0261c"/>
      <stop offset="1" stop-color="#9e1510"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#back)"/>
  <g fill="none" stroke-linejoin="round">
    <rect x="96" y="56" width="320" height="400" rx="44" stroke="#e8ebf0" stroke-width="22"/>
    <rect x="148" y="122" width="216" height="268" rx="30" stroke="#b9bfca" stroke-width="16" opacity="0.85"/>
    <rect x="190" y="174" width="132" height="164" rx="20" stroke="#8a92a0" stroke-width="11" opacity="0.7"/>
  </g>
  <circle cx="256" cy="256" r="44" fill="url(#dot)"/>
</svg>
