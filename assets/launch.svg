<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="320" height="480">
  <!-- The launch image of iOS 6 covers the screen under the status bar: a
       red navigation bar and an empty grouped table. -->
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c25a5a"/>
      <stop offset="0.5" stop-color="#a52626"/>
      <stop offset="0.5" stop-color="#9e1c1c"/>
      <stop offset="1" stop-color="#861515"/>
    </linearGradient>
  </defs>
  <rect width="320" height="480" fill="#d6d9de"/>
  <rect y="0" width="320" height="20" fill="#000000"/>
  <rect y="20" width="320" height="44" fill="url(#bar)"/>
  <rect y="63" width="320" height="1" fill="#4a0d0d"/>
</svg>
